# Walking-skeleton CI — a stack-agnostic starter workflow.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm


      - name: Install from the lock file
        run: ./script/setup

      - name: Lint
        run: ./script/lint

      - name: Test
        run: ./script/test

      - name: Build
        run: ./script/build

      - name: Start the app in the background
        run: |
          nohup ./script/start > /tmp/app.log 2>&1 &
          echo "started pid $!"
        env:
          PORT: "8080"

      - name: Smoke test — prove the skeleton walks here too
        run: ./script/smoke
        env:
          APP_BASE_URL: http://127.0.0.1:54321
          SMOKE_EXPECT: ".pumpkinPieImage.png"

      - name: Show the app log when a stage fails
        if: failure()
        run: tail -n 50 /tmp/app.log